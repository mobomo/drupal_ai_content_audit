services:
  _defaults:
    autowire: true

  logger.channel.ai_content_audit_scoring:
    parent: logger.channel_base
    arguments: ['ai_content_audit_scoring']
  Psr\Log\LoggerInterface: '@logger.channel.ai_content_audit_scoring'

  ai_content_audit_scoring.assessment_repository:
    class: Drupal\ai_content_audit_scoring\Repository\AiContentAssessmentRepository
  Drupal\ai_content_audit_scoring\Repository\AiContentAssessmentRepository: '@ai_content_audit_scoring.assessment_repository'

  ai_content_audit_scoring.audit_check_manager:
    class: Drupal\ai_content_audit_scoring\Plugin\Manager\AuditCheckManager
  Drupal\ai_content_audit_scoring\Plugin\Manager\AuditCheckManager: '@ai_content_audit_scoring.audit_check_manager'

  ai_content_audit_scoring.technical_audit:
    class: Drupal\ai_content_audit_scoring\Service\TechnicalAuditService
  Drupal\ai_content_audit_scoring\Service\TechnicalAuditService: '@ai_content_audit_scoring.technical_audit'

  ai_content_audit_scoring.assessment_service:
    class: Drupal\ai_content_audit_scoring\Service\AiAssessmentService
  Drupal\ai_content_audit_scoring\Service\AiAssessmentService: '@ai_content_audit_scoring.assessment_service'

  ai_content_audit_scoring.prompt_resolver:
    class: Drupal\ai_content_audit_scoring\Service\ScoringPromptResolver
  Drupal\ai_content_audit_scoring\Service\ScoringPromptResolver: '@ai_content_audit_scoring.prompt_resolver'

  ai_content_audit_scoring.lifecycle:
    class: Drupal\ai_content_audit_scoring\Service\AiContentAuditLifecycle
  Drupal\ai_content_audit_scoring\Service\AiContentAuditLifecycle: '@ai_content_audit_scoring.lifecycle'

  ai_content_audit_scoring.score_meta:
    class: Drupal\ai_content_audit_scoring\Service\ScoreMetaBuilder
  Drupal\ai_content_audit_scoring\Service\ScoreMetaBuilder: '@ai_content_audit_scoring.score_meta'

  ai_content_audit_scoring.airo_action_item_command:
    class: Drupal\ai_content_audit_scoring\Service\AiroActionItemCommand
  Drupal\ai_content_audit_scoring\Service\AiroActionItemCommand: '@ai_content_audit_scoring.airo_action_item_command'

  ai_content_audit_scoring.airo_inline_score_widget_builder:
    class: Drupal\ai_content_audit_scoring\Service\AiroInlineScoreWidgetBuilder
  Drupal\ai_content_audit_scoring\Service\AiroInlineScoreWidgetBuilder: '@ai_content_audit_scoring.airo_inline_score_widget_builder'

  ai_content_audit_scoring.filesystem_audit:
    class: Drupal\ai_content_audit_scoring\Service\FilesystemAuditService
  Drupal\ai_content_audit_scoring\Service\FilesystemAuditService: '@ai_content_audit_scoring.filesystem_audit'
  Drupal\ai_content_audit_scoring\Audit\FilesystemAuditRunnerInterface: '@ai_content_audit_scoring.filesystem_audit'

  ai_content_audit_scoring.airo_panel_tab_builder:
    class: Drupal\ai_content_audit_scoring\Service\AiroPanelTabBuilder
  Drupal\ai_content_audit_scoring\Service\AiroPanelTabBuilder: '@ai_content_audit_scoring.airo_panel_tab_builder'

  ai_content_audit_scoring.airo_panel_tab.score:
    class: Drupal\ai_content_audit_scoring\AiroPanel\Tab\ScoreTab
    tags:
      - { name: ai_content_audit.airo_panel_tab }
  Drupal\ai_content_audit_scoring\AiroPanel\Tab\ScoreTab: '@ai_content_audit_scoring.airo_panel_tab.score'

  ai_content_audit_scoring.airo_panel_tab.action_items:
    class: Drupal\ai_content_audit_scoring\AiroPanel\Tab\ActionItemsTab
    tags:
      - { name: ai_content_audit.airo_panel_tab }
  Drupal\ai_content_audit_scoring\AiroPanel\Tab\ActionItemsTab: '@ai_content_audit_scoring.airo_panel_tab.action_items'

  ai_content_audit_scoring.airo_panel_tab.technical_audit:
    class: Drupal\ai_content_audit_scoring\AiroPanel\Tab\TechnicalAuditTab
    tags:
      - { name: ai_content_audit.airo_panel_tab }
  Drupal\ai_content_audit_scoring\AiroPanel\Tab\TechnicalAuditTab: '@ai_content_audit_scoring.airo_panel_tab.technical_audit'

  Drupal\ai_content_audit_scoring\Hook\ScoringThemeHooks:
    class: Drupal\ai_content_audit_scoring\Hook\ScoringThemeHooks
