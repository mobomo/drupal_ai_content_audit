services:
  _defaults:
    autowire: true

  logger.channel.ai_site_audit:
    parent: logger.channel_base
    arguments: ['ai_site_audit']
  Psr\Log\LoggerInterface: '@logger.channel.ai_site_audit'

  ai_site_audit.aggregation:
    class: Drupal\ai_site_audit\Service\SiteAggregationService
  Drupal\ai_site_audit\Service\SiteAggregationService: '@ai_site_audit.aggregation'

  ai_site_audit.rollup:
    class: Drupal\ai_site_audit\Service\SiteRollupService
  Drupal\ai_site_audit\Service\SiteRollupService: '@ai_site_audit.rollup'

  ai_site_audit.analysis:
    class: Drupal\ai_site_audit\Service\SiteAnalysisService
  Drupal\ai_site_audit\Service\SiteAnalysisService: '@ai_site_audit.analysis'

  ai_site_audit.orchestrator:
    class: Drupal\ai_site_audit\Service\AnalysisOrchestrator
  Drupal\ai_site_audit\Service\AnalysisOrchestrator: '@ai_site_audit.orchestrator'
